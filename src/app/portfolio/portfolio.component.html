<div
  id="portfolio"
  class="relative min-h-[100dvh] flex items-center justify-center overflow-hidden py-20"
>
  <div class="relative z-10 max-w-7xl mx-auto px-6">
    <div class="text-center mb-16">
      <div class="mb-6">
        <span
          class="px-5 py-4 bg-linear-to-r from-pink-500/20 to-purple-500/20 text-pink-200 rounded-full border border-pink-500/30 font-medium"
        >
          My Work
        </span>
      </div>
      <h2
        class="text-4xl md:text-6xl font-bold bg-gradient-to-r from-pink-400 via-purple-500 to-blue-500 bg-clip-text text-transparent mb-6"
      >
        Featured Projects
      </h2>
      <p class="text-gray-300 text-lg max-w-2xl mx-auto">
        A collection of projects that showcase my skills and passion for
        creating nice-looking, functional web applications.
      </p>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div
        *ngFor="let project of projects"
        class="group bg-gradient-to-br from-slate-800/50 to-slate-900/50 rounded-2xl border border-slate-700/50 overflow-hidden hover:border-purple-500/30 transition-all duration-300 hover:scale-105"
      >
        <div class="image relative h-48 overflow-hidden">
          <div
            class="w-full h-full bg-gradient-to-br from-purple-600/20 to-pink-600/20 flex items-center justify-center"
          >
            <div class="text-center">
              <img [src]="project.imageSource" alt="Project Image" />
            </div>
          </div>
        </div>
        <div class="p-6">
          <h3
            class="text-xl font-bold text-pink-100 mb-3 group-hover:text-purple-300 transition-colors duration-300"
          >
            {{ project.title }}
          </h3>
          <p class="text-gray-300 text-sm leading-relaxed mb-4">
            {{ project.description }}
          </p>
          <div class="flex flex-wrap gap-2 mb-6">
            <span
              *ngFor="let tech of project.technologies"
              class="px-3 py-1 bg-purple-500/20 text-pink-100 rounded-full text-xs font-medium border border-purple-500/30"
            >
              {{ tech }}
            </span>
          </div>
          <div class="flex gap-3">
            <a
              [href]="project.demoLink"
              target="_blank"
              class="flex-1 px-4 py-2 bg-gradient-to-r from-pink-600 to-purple-600 text-white rounded-lg font-medium text-sm hover:shadow-lg hover:shadow-purple-500/25 hover:from-purple-600 hover:to-pink-600 transition-all duration-300 text-center"
            >
              <i class="fas fa-external-link-alt mr-2"></i>
              Live Demo
            </a>
            <a
              [href]="project.githubLink"
              target="_blank"
              class="px-4 py-2 border border-purple-500/50 text-purple-300 rounded-lg font-medium text-sm hover:bg-purple-500/10 transition-all duration-300"
            >
              <i class="fab fa-github"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
