<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto"
>
  <div
    *ngFor="let user of filteredUsers"
    class="bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700 hover:border-gray-600 transition-colors"
  >
    <div class="flex flex-col items-center mb-4">
      <img
        [src]="user.picUrl"
        [alt]="user.username + ' profile'"
        class="w-20 h-20 rounded-full object-cover mb-3"
      />

      <div class="flex items-center gap-2">
        <h3 class="text-xl font-semibold text-white">{{ user.username }}</h3>
        <i
          class="fas fa-star text-lg"
          [class]="user.isVerified ? 'text-green-500' : 'text-red-500'"
        ></i>
      </div>
    </div>
    <div class="space-y-3 text-gray-300">
      <div class="flex items-center gap-2">
        <i class="fas fa-envelope text-blue-400 w-4"></i>
        <span class="text-sm">{{ user.email }}</span>
      </div>

      <div class="flex items-center gap-2">
        <i class="fas fa-phone text-green-400 w-4"></i>
        <span class="text-sm">{{ user.phoneNumber }}</span>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="filteredUsers.length === 0 && users.length > 0"
  class="text-center text-gray-400 py-8"
>
  <i class="fas fa-search text-4xl mb-4"></i>
  <p class="text-lg">No users found matching your search.</p>
</div>

<div *ngIf="users.length === 0" class="text-center text-gray-400 py-8">
  <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
  <p class="text-lg">Loading users...</p>
</div>
